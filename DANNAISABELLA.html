<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danna Isabella | 2 años · Invitación de cuento</title>
    <meta
      name="description"
      content="La historia de Danna Isabella: un cuento de hadas que cobra vida."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        height: 100dvh;
        overflow: hidden;
        font-family: 'Cormorant Garamond', serif;
        color: #45261c;
        background:
          radial-gradient(circle at 50% 108%, rgba(110, 55, 130, 0.5), transparent 55%),
          radial-gradient(circle at 12% 88%, rgba(40, 120, 105, 0.22), transparent 34%),
          radial-gradient(circle at 90% 12%, rgba(190, 130, 210, 0.25), transparent 36%),
          linear-gradient(180deg, #170b28 0%, #2a1140 48%, #3a1650 100%);
      }
      button, a { font-family: inherit; }

      .stars {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(1.6px 1.6px at 12% 20%, rgba(255, 220, 130, 0.95), transparent),
          radial-gradient(2px 2px at 68% 12%, rgba(200, 170, 255, 0.9), transparent),
          radial-gradient(1.4px 1.4px at 40% 64%, rgba(255, 220, 130, 0.8), transparent),
          radial-gradient(2px 2px at 86% 54%, rgba(255, 180, 210, 0.85), transparent),
          radial-gradient(1.5px 1.5px at 26% 82%, rgba(255, 220, 130, 0.8), transparent),
          radial-gradient(2px 2px at 58% 38%, rgba(210, 180, 255, 0.7), transparent),
          radial-gradient(1.4px 1.4px at 74% 86%, rgba(255, 220, 130, 0.75), transparent);
        background-size: 300px 300px;
        opacity: 0.9;
        animation: starDrift 34s linear infinite;
      }
      @keyframes starDrift { to { background-position: 300px 300px; } }

      .rays {
        position: fixed; left: 50%; top: 52%;
        width: 150vmax; height: 150vmax;
        transform: translate(-50%, -50%);
        z-index: 1; pointer-events: none; opacity: 0.55;
        background: conic-gradient(
          from 0deg at 50% 50%,
          transparent 0deg, rgba(255, 190, 240, 0.12) 18deg, transparent 44deg,
          rgba(255, 205, 160, 0.13) 72deg, transparent 104deg,
          rgba(200, 180, 255, 0.12) 148deg, transparent 186deg,
          rgba(255, 190, 240, 0.12) 224deg, transparent 260deg,
          rgba(255, 205, 160, 0.13) 300deg, transparent 340deg,
          rgba(255, 190, 240, 0.12) 360deg);
        animation: raySpin 40s linear infinite;
      }
      @keyframes raySpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

      /* ---------- SCENE 1: BIG FAIRYTALE CASTLE ---------- */
      .scene-castle {
        position: fixed; inset: 0; z-index: 5;
        transition: opacity 0.9s ease;
      }
      .scene-castle .inner {
        position: absolute; inset: 0;
        will-change: transform, filter;
      }
      .scene-castle svg { width: 100%; height: 100%; display: block; }

      .open-hint {
        position: absolute; left: 50%; top: 16%;
        transform: translateX(-50%) translateY(12px);
        z-index: 6; cursor: pointer;
        opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease;
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(0.95rem, 2.6vw, 1.3rem);
        letter-spacing: 0.06em; color: #fff8ea;
        background: linear-gradient(120deg, rgba(122, 47, 82, 0.92), rgba(156, 60, 99, 0.92));
        border: 1.5px solid rgba(255, 224, 150, 0.85);
        border-radius: 999px;
        padding: 10px 24px;
        box-shadow: 0 6px 18px rgba(40, 10, 30, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        -webkit-tap-highlight-color: transparent;
      }
      .open-hint.on {
        opacity: 1; transform: translateX(-50%) translateY(0);
        animation: hintPulse 2.2s ease-in-out infinite;
      }
      .open-hint:hover { background: linear-gradient(120deg, rgba(156, 60, 99, 0.98), rgba(190, 76, 120, 0.98)); }
      @keyframes hintPulse {
        0%, 100% { box-shadow: 0 6px 18px rgba(40, 10, 30, 0.4); transform: translateX(-50%) translateY(0) scale(1); }
        50% { box-shadow: 0 6px 26px rgba(255, 190, 110, 0.55); transform: translateX(-50%) translateY(0) scale(1.035); }
      }

      .castle-float { animation: castleBob 6.5s ease-in-out infinite; }
      @keyframes castleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      .puff { animation: cloudDrift 9s ease-in-out infinite alternate; transform-box: fill-box; }
      .puff.p2 { animation-duration: 12s; animation-direction: alternate-reverse; }
      .puff.p3 { animation-duration: 15s; }
      @keyframes cloudDrift { from { transform: translateX(-20px); } to { transform: translateX(20px); } }
      .sway { animation: flowerSway 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .sway.s2 { animation-duration: 6.4s; animation-delay: -2s; }
      .sway.s3 { animation-duration: 7s; animation-delay: -4s; }
      @keyframes flowerSway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.4deg); } }
      .bfly { animation: flutter 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bfly.b2 { animation-duration: 8s; animation-delay: -3s; }
      @keyframes flutter {
        0%,100% { transform: translate(0,0) rotate(-6deg); }
        50% { transform: translate(14px,-12px) rotate(10deg); }
      }
      .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle.t2 { animation-delay: -1.4s; }
      @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      /* ---------- TRANSITION MIST ---------- */
      .mist {
        position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 250, 240, 0.98), rgba(255, 244, 226, 0.6) 45%, rgba(255, 240, 220, 0) 75%);
      }
      .mist.on { opacity: 1; }

      /* ---------- SCENE 2: STORYBOOK ---------- */
      .stage-book {
        position: fixed; inset: 0; z-index: 10;
        display: grid; place-items: center;
        opacity: 0; visibility: hidden;
        transition: opacity 1s ease, visibility 1s;
        background:
          radial-gradient(circle at 50% 30%, rgba(220, 160, 120, 0.16), transparent 42%),
          radial-gradient(circle at 50% 88%, rgba(120, 60, 130, 0.42), transparent 56%);
      }
      .stage-book.on { opacity: 1; visibility: visible; }
      .book-wrap {
        grid-area: 1 / 1;
        width: min(980px, 96vw);
        perspective: 2200px;
        perspective-origin: 50% 42%;
        will-change: transform;
      }
      .book {
        position: relative;
        width: 100%;
        aspect-ratio: 3 / 2;
        max-height: 84vh;
        transform-style: preserve-3d;
        will-change: transform, filter;
      }
      .book.floaty { animation: bookBob 6s ease-in-out infinite; }
      @keyframes bookBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .book-glow {
        grid-area: 1 / 1; z-index: 0; pointer-events: none;
        width: 120%; height: 150%;
        background: radial-gradient(circle, rgba(255, 214, 130, 0.32), rgba(255, 190, 160, 0.12) 42%, transparent 68%);
        animation: glowPulse 4.5s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%,100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }

      .half { position: absolute; top: 0; height: 100%; width: 50%; backface-visibility: hidden; will-change: transform; }
      #halfL { left: 0; transform-origin: 100% 50%; }
      #halfR { right: 0; transform-origin: 0% 50%; }

      /* ---------- PAGES ---------- */
      :root { --gold: rgba(176, 124, 40, 0.75); --goldline: rgba(190, 140, 60, 0.4); }
      .pg {
        position: absolute; inset: 0; overflow: hidden;
        background:
          radial-gradient(circle at 22% 12%, rgba(255, 255, 255, 0.6), transparent 36%),
          radial-gradient(circle at 80% 90%, rgba(120, 84, 48, 0.16), transparent 46%),
          repeating-linear-gradient(94deg, rgba(120, 90, 40, 0.015) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(88deg, rgba(120, 90, 40, 0.01) 0 2px, transparent 2px 5px),
          linear-gradient(178deg, #fdf7e7 0%, #f5e9ce 60%, #eedfbe 100%);
        box-shadow:
          inset 0 0 0 1px rgba(190, 140, 60, 0.25),
          inset 0 0 60px rgba(110, 66, 30, 0.14),
          0 1.5px 0 rgba(110, 80, 35, 0.12),
          0 3px 0 rgba(110, 80, 35, 0.09),
          0 5px 0 rgba(110, 80, 35, 0.07),
          0 7px 0 rgba(110, 80, 35, 0.06),
          0 12px 0 rgba(110, 80, 35, 0.03),
          0 20px 48px rgba(16, 6, 26, 0.6);
      }
      .pg::before, .pg::after {
        content: ""; position: absolute; width: 52px; height: 52px; z-index: 3;
        border-style: solid; border-color: rgba(190, 140, 60, 0.55);
        box-shadow: inset 0 0 0 2px rgba(255, 244, 210, 0.55);
      }
      .pg::before { top: 10px; left: 10px; border-width: 2.5px 0 0 2.5px; }
      .pg::after { top: 10px; right: 10px; border-width: 2.5px 2.5px 0 0; }
      .cb {
        position: absolute; bottom: 10px; width: 52px; height: 52px;
        border-style: solid; border-color: rgba(190, 140, 60, 0.55);
        box-shadow: inset 0 0 0 2px rgba(255, 244, 210, 0.55);
        z-index: 3; pointer-events: none;
      }
      .cb { left: 10px; border-width: 0 0 2.5px 2.5px; }
      .cb.r { right: 10px; border-width: 0 2.5px 2.5px 0; left: auto; }
      .pg-bd {
        position: absolute; inset: 13px;
        border: 1px solid rgba(190, 140, 60, 0.35);
        pointer-events: none; z-index: 2;
      }
      .pg-bd::after {
        content: ""; position: absolute; inset: 4px;
        border: 1px dotted rgba(190, 140, 60, 0.5);
      }
      .pg-inner {
        position: absolute; inset: 26px 20px 24px 20px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: 10px; z-index: 4;
        isolation: isolate;
      }

      .crown-wrap svg { width: 46px; height: auto; filter: drop-shadow(0 2px 5px rgba(160, 110, 20, 0.45)); }
      .nm { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .nm span { display: block; }
      .nm .danna {
        font-family: 'Cormorant Garamond', serif; font-weight: 700;
        font-size: clamp(1rem, 3.5vw, 1.8rem);
        letter-spacing: 0.46em; text-indent: 0.46em; text-transform: uppercase;
        color: transparent;
        background: linear-gradient(180deg, #b0562f 0%, #c74f5d 45%, #8f173d 100%);
        -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 1px 0 rgba(255, 250, 225, 0.85)) drop-shadow(0 2px 5px rgba(120, 30, 70, 0.28));
      }
      .nm .isabella {
        font-family: 'Great Vibes', cursive; font-weight: 400;
        font-size: clamp(2.3rem, 7.6vw, 4.4rem);
        line-height: 1.05; letter-spacing: 0.02em;
        color: transparent;
        background: linear-gradient(180deg, #a17808 0%, #d9a440 40%, #8a5f14 80%, #b07c28 100%);
        -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 1px 0 rgba(255, 250, 225, 0.9)) drop-shadow(0 3px 6px rgba(90, 55, 10, 0.32));
        margin-top: -8px;
      }
      .rule-orn {
        display: flex; align-items: center; gap: 9px; color: #c98a48; margin-top: 4px;
      }
      .rule-orn::before, .rule-orn::after {
        content: ""; width: 32px; height: 1px;
      }
      .rule-orn::before { background: linear-gradient(90deg, transparent, #caa04a); }
      .rule-orn::after { background: linear-gradient(90deg, #caa04a, transparent); }
      .age {
        font-family: 'Cinzel', serif; font-weight: 800;
        font-size: clamp(1.25rem, 4vw, 2.1rem);
        letter-spacing: 0.5em; text-indent: 0.5em;
        color: transparent;
        background: linear-gradient(180deg, #9c1f4a 0%, #c74f7b 40%, #8a1740 100%);
        -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 1px 0 rgba(255, 250, 225, 0.9)) drop-shadow(0 2px 5px rgba(120, 30, 70, 0.3));
      }

      .kick {
        font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.4em; text-indent: 0.4em;
        font-size: clamp(0.6rem, 1.7vw, 0.8rem); color: #9a6a35;
      }
      .mini-orn { font-size: 0.9rem; color: #c98a48; letter-spacing: 0.4em; text-indent: 0.4em; }

      .p-deco { background-color: #f8efd8; }
      .deco-art { width: 74%; max-width: 300px; }
      .pg-img {
        width: min(86%, 300px);
        height: auto;
        max-height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 6px 14px rgba(60, 20, 45, 0.28));
      }
      .p-deco-right { background-color: #fcf6e6; }

      /* ---------- COVERS ---------- */
      .cover {
        position: absolute; top: -8px; height: calc(100% + 16px); width: 50%;
        z-index: 8; border-radius: 6px;
        background:
          radial-gradient(circle at 30% 18%, rgba(210, 245, 228, 0.16), transparent 34%),
          radial-gradient(circle at 70% 88%, rgba(0, 0, 0, 0.4), transparent 50%),
          linear-gradient(150deg, #1d5a42 0%, #11412f 52%, #0b2f22 100%);
        box-shadow:
          inset 0 0 0 2px #f2cf86,
inset 0 0 0 2px #d9b96a,
          inset 0 0 0 5px rgba(255, 235, 180, 0.18),
          inset 0 0 0 13px #d9b96a,
          inset 0 0 34px rgba(0, 0, 0, 0.65),
          0 18px 44px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }
      .cover .emb { position: absolute; inset: 15px; border: 2px solid rgba(217, 185, 106, 0.85); display: grid; place-items: center; }
      .cover .emb::before {
        content: ""; position: absolute; inset: 5px;
        border: 1px dotted rgba(217, 185, 106, 0.55);
      }
      .cover .emb svg { width: 126px; height: 126px; }
      .cover .band { position: absolute; left: 0; right: 0; height: 13px; background: linear-gradient(180deg, #f2cf86, #c7953a, #8a5f14); opacity: 0.85; }
      .cover .band.t { top: 0; }
      .cover .band.b { bottom: 0; }
      .cover .crown-c { position: absolute; top: 26%; left: 50%; transform: translateX(-50%); }

      /* ---------- FLIPPING SHEET ---------- */
      .flip {
        position: absolute; left: 50%; top: 0; width: 50%; height: 100%;
        z-index: 12; opacity: 0; transform-origin: 0% 50%;
        will-change: transform, opacity;
      }
      .flip-inner { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
      .f-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
      .f-back { transform: rotateY(180deg); }
      .flipShade {
        position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
        background: linear-gradient(105deg, rgba(255, 250, 236, 0.88) 0%, rgba(255, 250, 236, 0.1) 45%, rgba(40, 18, 12, 0.34) 100%);
        will-change: opacity;
      }
      .castle-art-wrap { inset: 0 !important; position: absolute; }
      .art-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      .pg-full {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: contain;
      }

      .gutter {
        position: absolute; left: 50%; top: 3%; bottom: 3%; width: 10px;
        transform: translateX(-50%); z-index: 7; pointer-events: none;
        background: linear-gradient(90deg, rgba(70,45,18,0) 0%, rgba(70,45,18,0.38) 32%, rgba(90,58,24,0.5) 50%, rgba(70,45,18,0.38) 68%, rgba(70,45,18,0) 100%);
        border-radius: 50%;
      }
      .shelf {
        grid-area: 1 / 1; align-self: end; justify-self: center; margin-bottom: 4%;
        width: 78%; height: 26px; pointer-events: none;
        background: radial-gradient(50% 100% at 50% 0%, rgba(20, 6, 28, 0.5), transparent 100%);
        filter: blur(3px);
        animation: shadowBreath 5s ease-in-out infinite;
      }
      @keyframes shadowBreath { 0%,100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(0.94); opacity: 0.6; } }

      /* ---------- MAGIC SCROLL ---------- */
      .scroll {
        position: fixed; left: 50%; top: 50%;
        width: min(470px, 86vw);
        z-index: 16;
        opacity: 0;
        transform: translate(-50%, -50%);
        will-change: transform, opacity;
      }
      .scroll .roll {
        position: absolute; left: -14px; right: -14px; height: 24px; pointer-events: none;
        border-radius: 8px;
        background: linear-gradient(180deg, #e7cf9c 0%, #cfa96a 35%, #b98a4d 60%, #d9bb86 100%);
        box-shadow: 0 0 12px rgba(90, 55, 15, 0.4), inset 0 1px 0 rgba(255, 244, 214, 0.6);
      }
      .scroll .roll.t { top: -10px; }
      .scroll .roll.b { bottom: -10px; }
      .scroll .roll::after {
        content: ""; position: absolute; left: 50%; top: 50%;
        width: 10px; height: 10px; transform: translate(-50%, -50%) rotate(45deg);
        background: radial-gradient(circle at 35% 35%, #d9bb86, #a5763c);
        border-radius: 2px;
      }
      .scroll-body {
        position: relative;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.6), transparent 32%),
          radial-gradient(circle at 50% 100%, rgba(120, 80, 30, 0.2), transparent 44%),
          linear-gradient(180deg, #faf1d8 0%, #f3e2bd 60%, #ecd9ac 100%);
        box-shadow:
          inset 0 0 0 1.5px rgba(180, 140, 60, 0.4),
          inset 0 0 0 6px rgba(180, 140, 60, 0.12),
          inset 0 0 34px rgba(150, 100, 45, 0.3),
          0 34px 70px rgba(15, 6, 25, 0.6);
        padding: 34px 30px 44px;
        text-align: center;
        border-radius: 6px 6px 10px 10px;
      }
      .scroll-orn { position: absolute; width: 64px; height: 64px; opacity: 0.85; }
      .scroll-orn.tl { top: -4px; left: -2px; }
      .scroll-orn.tr { top: -4px; right: -2px; transform: scaleX(-1); }
      .scroll-orn.bl { bottom: 10px; left: -2px; transform: scaleY(-1); }
      .scroll-orn.br { bottom: 10px; right: -2px; transform: scale(-1); }
      .scroll-orn img, .scroll-orn svg { width: 100%; height: 100%; }

      .sc-item { opacity: 0; transform: translateY(8px); transition: opacity 0.8s ease, transform 0.8s ease; }
      .sc-item.on { opacity: 1; transform: translateY(0); }
      .sc-kick { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.5em; text-indent: 0.5em; font-size: 0.66rem; color: #9a6a35; }
      .sc-name {
        font-family: 'Great Vibes', cursive;
        color: #a13f66;
        font-size: clamp(2.2rem, 7vw, 3.3rem);
        line-height: 1; margin-top: 4px;
        text-shadow: 0 3px 14px rgba(161, 63, 102, 0.32);
      }
      .sc-sub {
        font-family: 'Cinzel', serif; font-weight: 700; color: #5a3a20;
        font-size: clamp(1rem, 3.1vw, 1.45rem); letter-spacing: 0.12em;
        margin-top: 6px;
      }
      .sc-sub b { color: #a13f66; }
      .sc-date {
        font-family: 'Cinzel', serif; font-weight: 700;
        color: transparent;
        background: linear-gradient(180deg, #a17808, #d9a440 45%, #8a5f14);
        -webkit-background-clip: text; background-clip: text;
        font-size: clamp(1.15rem, 3.4vw, 1.65rem); letter-spacing: 0.18em;
        margin-top: 4px;
        filter: drop-shadow(0 1px 0 rgba(255, 250, 225, 0.7));
      }
      .sc-div { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 12px 0 2px; color: #c98a48; }
      .sc-div::before, .sc-div::after { content: ""; width: 46px; height: 1px; }
      .sc-div::before { background: linear-gradient(90deg, transparent, #caa04a); }
      .sc-div::after { background: linear-gradient(90deg, #caa04a, transparent); }
      .sc-loc-kick { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 0.4em; text-indent: 0.4em; font-size: 0.72rem; color: #7a5230; margin-top: 6px; }

      .maps-btn {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 12px;
        padding: 12px 24px;
        font-family: 'Quicksand', sans-serif; font-weight: 700;
        font-size: 0.98rem; letter-spacing: 0.16em;
        color: #fff8e8;
        text-decoration: none;
        background: linear-gradient(160deg, #c2596f 0%, #8e2f52 100%);
        border: 2px solid #f2cf86;
        border-radius: 40px;
        box-shadow: 0 10px 22px rgba(110, 25, 60, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .maps-btn:hover, .maps-btn:focus-visible { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 28px rgba(110, 25, 60, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
      .maps-btn:active { transform: translateY(0) scale(0.98); }
      .maps-btn .pin { font-size: 1.05rem; }
      .sc-addr { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; color: #7a5230; font-size: clamp(0.82rem, 2.4vw, 1rem); margin-top: 12px; line-height: 1.35; }

      /* ---------- PARTICLES ---------- */
      #sparkles { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
      .dust {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle, #fff8e3, rgba(255, 205, 150, 0.7) 55%, transparent);
        box-shadow: 0 0 8px 1px rgba(255, 226, 170, 0.7);
        opacity: 0; animation: dustFloat 8s ease-in-out infinite;
      }
      @keyframes dustFloat {
        0% { transform: translate(0, 30px) scale(0.4); opacity: 0; }
        15% { opacity: 0.95; }
        55% { opacity: 0.9; }
        100% { transform: translate(26px, -160px) scale(1.05); opacity: 0; }
      }
      .firefly {
        position: absolute; border-radius: 50%; width: 6px; height: 6px;
        background: radial-gradient(circle, #fff7d6, #ffd060 60%, transparent);
        box-shadow: 0 0 14px 3px rgba(255, 208, 96, 0.85);
        opacity: 0; animation: fireflyMove 11s ease-in-out infinite;
      }
      @keyframes fireflyMove {
        0%,100% { transform: translate(0,0); opacity: 0; }
        12% { opacity: 0.95; transform: translate(30px,-46px); }
        40% { opacity: 0.75; transform: translate(-24px,-96px); }
        70% { opacity: 0.9; transform: translate(20px,-150px); }
      }
      .burst {
        position: absolute; width: 5px; height: 5px; border-radius: 50%;
        background: radial-gradient(circle, #fffdf2, #ffd78a 60%, transparent);
        box-shadow: 0 0 10px 2px rgba(255, 220, 150, 0.8);
        animation: burstFly 1.5s ease-out forwards;
      }
      @keyframes burstFly {
        0% { transform: translate(-50%,-50%) scale(0.25) rotate(0deg); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.9) rotate(40deg); opacity: 0; }
      }

      .vignette { position: fixed; inset: 0; z-index: 45; pointer-events: none; background: radial-gradient(circle at 50% 45%, transparent 52%, rgba(10, 4, 20, 0.55) 100%); }

      .corner-btn {
        position: fixed; z-index: 50;
        width: 48px; height: 48px; border-radius: 50%;
        display: grid; place-items: center;
        background: linear-gradient(160deg, #6f3a57, #3a1c3a);
        color: #ffe9b0; font-size: 1.15rem;
        border: 2px solid rgba(255, 217, 119, 0.55);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        opacity: 0; pointer-events: none; transform: translateY(12px);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .corner-btn.on { opacity: 1; pointer-events: auto; transform: translateY(0); }
      .corner-btn.playing .note { animation: noteBounce 1s ease-in-out infinite; }
      @keyframes noteBounce { 0%,100% { transform: scale(1) rotate(-8deg); } 50% { transform: scale(1.25) rotate(8deg); } }
      #musicBtn { right: 16px; bottom: 16px; }
      #replayBtn { right: 76px; bottom: 16px; font-size: 1.3rem; }

      /* ---------- baby princess sprites ---------- */
      #pr, #prhead { --hair: #7a4a2c; --bodice: #f2c14e; --dress: #f2c14e; --dress2: #d9a63c; --bow: #7a4a2c; }
      .pr-row {
        display: flex; align-items: flex-end; justify-content: center;
        gap: 4px; margin-top: 14px;
      }
      .pr-row svg {
        height: clamp(36px, 10vw, 54px); width: auto;
        filter: drop-shadow(0 5px 10px rgba(120, 40, 60, 0.3));
      }
      .pr-tiny {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1.5px solid rgba(242, 207, 134, 0.85);
        background: rgba(43, 18, 38, 0.85);
        display: grid; place-items: center;
      }
      .pr-tiny svg { width: 18px; height: 18px; }

      /* ---------- silk bookmark ribbon ---------- */
      .ribbon {
        position: absolute; left: 50%; top: 100%;
        width: 46px; height: 150px; z-index: 6; pointer-events: none;
        background: linear-gradient(180deg, #7e2c46 0%, #5a1d32 100%);
        border-left: 1px solid rgba(255, 224, 150, 0.5);
        border-right: 1px solid rgba(255, 224, 150, 0.5);
        clip-path: polygon(0 0, 100% 0, 100% 90%, 56% 90%, 50% 100%, 44% 90%, 0 90%);
        box-shadow: 0 14px 24px rgba(20, 6, 25, 0.5);
        transform: translateX(-50%);
        transform-origin: 50% 0;
        animation: ribbonSway 5s ease-in-out infinite alternate;
      }
      @keyframes ribbonSway {
        from { transform: translateX(-50%) rotate(-2.5deg); }
        to { transform: translateX(-50%) rotate(2.5deg); }
      }

      /* ---------- scroll time line ---------- */
      .sc-time {
        font-family: 'Cinzel', serif; font-weight: 800;
        color: transparent;
        background: linear-gradient(180deg, #a17808, #d9a440 45%, #8a5f14);
        -webkit-background-clip: text; background-clip: text;
        font-size: clamp(1.1rem, 3.3vw, 1.6rem);
        letter-spacing: 0.26em; text-indent: 0.26em;
        margin-top: 4px;
        filter: drop-shadow(0 1px 0 rgba(255, 250, 225, 0.7));
      }

      @media (max-width: 560px) {
        .pg-inner { inset: 20px 12px 18px 12px; gap: 6px; }
        .pg::before, .pg::after { width: 22px; height: 22px; top: 10px; }
        .pg::before { left: 10px; } .pg::after { right: 10px; }
        .cb { width: 22px; height: 22px; bottom: 10px; }
        .cb { left: 10px; } .cb.r { right: 10px; }
        .nm { letter-spacing: 0.05em; }
        .scroll-body { padding: 30px 20px 40px; }
        .scroll .roll { left: -10px; right: -10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .dust, .firefly { animation: none; opacity: 0.4; }
        .rays, .puff, .sway, .bfly, .twinkle, .castle-float, .floaty, .book-glow { animation-duration: 60s; }
      }

          <svg class="scroll-orn br" viewBox="0 0 60 60" aria-hidden="true">
            <path d="M10 52 C12 40 24 38 30 44 C30 40 36 38 44 40" fill="none" stroke="#c78f2e" stroke-width="1.6" />
            <circle cx="22" cy="44" r="3.2" fill="#c74f7b" />

          <div class="sc-item sc-1"><p class="sc-kick">— LA HISTORIA DE —</p></div>
          <div class="sc-item sc-2"><p class="sc-name">Danna Isabella</p></div>
          <div class="sc-item sc-3"><p class="sc-sub"><b>2 años</b></p></div>
          <div class="sc-item sc-4"><p class="sc-date">10 OCTUBRE</p></div>
          <div class="sc-item sc-45"><p class="sc-time">3:00 P.M.</p></div>

          <div class="sc-item sc-6"><p class="sc-loc-kick">UBICACIÓN</p></div>
          <div class="sc-item sc-7">
            <a
              class="maps-btn"
              href="https://www.google.com/maps/search/?api=1&query=Calle+Gladiola+198%2C+Col.+Corrales+de+Engorda"
              target="_blank"
              rel="noopener"
            >
              <span class="pin">⌖</span> VER UBICACIÓN
            </a>

<div class="sc-item sc-8"><p class="sc-addr">Calle Gladiola #198 · Col. Corrales de Engorda</p></div>

    <div class="mist" id="mist" aria-hidden="true"></div>
    <div id="sparkles" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <button class="corner-btn" id="musicBtn" aria-label="Música">
      <span class="note">♪</span>
    </button>
    <button class="corner-btn" id="replayBtn" aria-label="Ver de nuevo">&crarr;</button>

    <script>
      (function () {
        'use strict';
        var castleScene = document.getElementById('castleScene');
        var castleInner = document.getElementById('castleInner');
        var openHint = document.getElementById('openHint');
        var mist = document.getElementById('mist');
        var stageBook = document.getElementById('bookStage');
        var book = document.getElementById('book');
        var halfL = document.getElementById('halfL');
        var halfR = document.getElementById('halfR');
        var coverL = document.getElementById('coverL');
        var coverR = document.getElementById('coverR');
        var flip = document.getElementById('flip');
        var flipInner = document.getElementById('flipInner');
        var flipShade = document.getElementById('flipShade');
        var scroll = document.getElementById('scroll');
        var scItems = document.querySelectorAll('.sc-item');
        var sparkles = document.getElementById('sparkles');
        var musicBtn = document.getElementById('musicBtn');
        var replayBtn = document.getElementById('replayBtn');

        /* ---------- music ---------- */
        var audio = new Audio('cancion.mp3');
        audio.loop = true;
        audio.preload = 'auto';
        audio.volume = 0;
        var musicStarted = false;
        function tuneStartPoint() {
          try { if (audio.duration && audio.duration > 55) audio.currentTime = 50; } catch (e) {}
        }
        audio.addEventListener('loadedmetadata', tuneStartPoint);
        function rampIn() {
          var t0 = performance.now();
          (function tick(t) {
            var p = Math.min(1, (t - t0) / 3400);
            audio.volume = p * 0.82;
            if (p < 1) requestAnimationFrame(tick);
          })(performance.now());
        }
        function startMusic() {
          if (musicStarted) return;
          musicStarted = true;
          tuneStartPoint();
          musicBtn.classList.add('playing');
          audio.play().then(rampIn).catch(function () {
            /* autoplay may need a gesture */
            musicStarted = false;
          });
        }
        function stopMusic() {
          audio.pause();
        }
        musicBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (audio.paused) {
            if (!musicStarted) { startMusic(); }
            else { audio.play().catch(function () {}); rampIn(); }
            musicBtn.classList.add('playing');
          } else {
            audio.pause();
            musicBtn.classList.remove('playing');
          }
        });
        function unlockMusic() {
          if (!musicStarted) { try { startMusic(); } catch (e) {} }
        }
        document.addEventListener('click', unlockMusic, { once: true });
        document.addEventListener('touchstart', unlockMusic, { once: true });
        document.addEventListener('keydown', unlockMusic, { once: true });
        replayBtn.addEventListener('click', function () {
          sparkles.innerHTML = '';
          dust(30); fireflies();
          try { audio.pause(); } catch (e) {}
          musicStarted = false;
          musicBtn.classList.remove('playing');
          timeline();
        });

        /* ---------- helpers ---------- */
        function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function drive(dur, ease, step, done) {
          return new Promise(function (res) {
            var t0 = performance.now();
            function tick(t) {
              var p = Math.min(1, (t - t0) / dur);
              step(ease(p));
              if (p < 1) requestAnimationFrame(tick);
              else { if (done) done(); res(); }
            }
            requestAnimationFrame(tick);
          });
        }
        var eOut = function (p) { return 1 - Math.pow(1 - p, 3); };
        var eInOut = function (p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
        var eInOutSine = function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; };

        /* ---------- castle click to open ---------- */
        var openResolve = null;
        function hintTap() {
          if (openResolve) { var r = openResolve; openResolve = null; r(); }
        }
        openHint.addEventListener('click', hintTap);
        castleScene.addEventListener('click', hintTap);
        function waitForOpen() {
          return new Promise(function (res) { openResolve = res; });
        }

        /* ---------- particles ---------- */
        function dust(n) {
          for (var i = 0; i < (n || 34); i++) {
            (function () {
              var s = document.createElement('span');
              s.className = 'dust';
              var size = 3 + Math.random() * 7;
              s.style.width = size + 'px';
              s.style.height = size + 'px';
              s.style.left = (2 + Math.random() * 96) + '%';
              s.style.top = (4 + Math.random() * 88) + '%';
              s.style.animationDelay = (Math.random() * 6) + 's';
              s.style.animationDuration = (6 + Math.random() * 6) + 's';
              sparkles.appendChild(s);
            })();
          }
        }
        function fireflies() {
          for (var i = 0; i < 8; i++) {
            (function () {
              var s = document.createElement('span');
              s.className = 'firefly';
              s.style.left = (8 + Math.random() * 84) + '%';
              s.style.top = (30 + Math.random() * 55) + '%';
              s.style.animationDelay = (Math.random() * 10) + 's';
              s.style.animationDuration = (8 + Math.random() * 6) + 's';
              sparkles.appendChild(s);
            })();
          }
        }
        function burst(cx, cy, count) {
          for (var i = 0; i < (count || 20); i++) {
            (function () {
              var s = document.createElement('span');
              s.className = 'burst';
              var a = Math.random() * Math.PI * 2;
              var d = 40 + Math.random() * 140;
              s.style.setProperty('--tx', (Math.cos(a) * d) + 'px');
              s.style.setProperty('--ty', (Math.sin(a) * d) + 'px');
              s.style.width = s.style.height = (4 + Math.random() * 6) + 'px';
              s.style.left = (cx || 50) + '%';
              s.style.top = (cy || 50) + '%';
              s.style.animationDelay = (Math.random() * 0.35) + 's';
              sparkles.appendChild(s);
              setTimeout(function () { s.remove(); }, 2400);
            })();
          }
        }

        /* ---------- reset state ---------- */
        function reset() {
          castleScene.style.opacity = '1';
          castleScene.style.visibility = 'visible';
          castleInner.style.transform = 'scale(1) translateY(0)';
          castleInner.style.filter = 'blur(0px)';
          openHint.classList.remove('on');
          openHint.style.visibility = 'visible';
          mist.classList.remove('on');
          stageBook.classList.remove('on');
          book.classList.remove('floaty');
          halfL.style.transform = 'scaleX(0.14)';
          halfR.style.transform = 'scaleX(0.14)';
          coverL.style.transform = 'scaleX(1)';
          coverR.style.transform = 'scaleX(1)';
          coverL.style.opacity = '1';
          coverR.style.opacity = '1';
          halfL.querySelector('.pg-inner').style.opacity = '0';
          halfR.querySelector('.pg-inner').style.opacity = '0';
          flipInner.style.transform = 'rotateY(0deg) rotateX(0deg)';
          flip.style.opacity = '0';
          flip.style.transform = 'translateY(0)';
          flipShade.style.opacity = '0';
          scroll.style.opacity = '0';
          scroll.style.transform = 'translate(-50%, -50%) translateY(46px) scaleY(0.3) rotate(-2deg)';
          for (var i = 0; i < scItems.length; i++) scItems[i].classList.remove('on');
          musicBtn.classList.remove('on');
          replayBtn.classList.remove('on');
        }

        /* ---------- timeline ---------- */
        async function timeline() {
          reset();
          openHint.classList.add('on');
          musicBtn.classList.add('on');
          startMusic();

          await wait(120);

          /* soft entrance of the castle */
          castleScene.style.opacity = '0';
          castleScene.style.transition = 'none';
          await wait(30);
          castleScene.style.transition = '';
          castleScene.style.opacity = '1';
          await drive(1200, eOut, function (p) {
            castleInner.style.transform = 'scale(' + (1.06 - 0.05 * p) + ') translateY(-14px)';
            castleInner.style.filter = 'blur(' + (8 * (1 - p)) + 'px)';
          });
          await wait(500);

          /* gentle dreamy camera move */
          await drive(2600, eInOutSine, function (p) {
            castleInner.style.transform = 'scale(' + (1.01 + 0.12 * p) + ') translateY(' + (-24 * p) + 'px)';
          });
          await wait(500);
          burst(50, 38, 20);

          /* wait for the castle to be touched, then unravel the scroll */
          await waitForOpen();
          openHint.classList.remove('on');
          burst(50, 56, 22);

          /* magic transition: dim the castle */
          mist.classList.add('on');
          await wait(480);
          await Promise.all([
            drive(950, eInOut, function (p) {
              castleScene.style.opacity = String(0.15 + 0.85 * (1 - p));
              castleInner.style.transform = 'scale(' + (1.13 + 0.16 * p) + ') translateY(-30px)';
              castleInner.style.filter = 'blur(' + (7 * p) + 'px)';
            }),
            (async function () {
              await wait(300);
              musicBtn.classList.add('on');
              startMusic();
            })()
          ]);
          await drive(700, eInOut, function (p) { mist.style.opacity = String(1 - p); });
          mist.classList.remove('on');
          mist.style.opacity = '';
          castleInner.style.transform = '';
          castleInner.style.filter = '';
          await wait(260);
          burst(50, 46, 20);

          /* the parchment unrolls over the castle */
          scroll.style.visibility = 'visible';
          await drive(1150, function (p) { return 1 - Math.pow(1 - p, 3); }, function (p) {
            scroll.style.opacity = String(p);
            scroll.style.transform =
              'translate(-50%, -50%) translateY(' + (34 * (1 - p)) + 'px) scaleY(' + (0.32 + 0.68 * p) + ') rotate(-1.6deg)';
          });
          await wait(160);
          for (var i = 0; i < scItems.length; i++) {
            await wait(130);
            scItems[i].classList.add('on');
          }
          burst(50, 50, 30);
          burst(30, 66, 14);
          burst(70, 34, 14);
          await wait(800);
          musicBtn.classList.add('on');
          replayBtn.classList.add('on');
        }
        /* ---------- slight extra style for scroll so it sits above pages ---------- */
        scroll.style.visibility = 'hidden';

        dust(34);
        fireflies();
        timeline();
      })();
    </script>
  </body>
